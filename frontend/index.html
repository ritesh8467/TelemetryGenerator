<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetry Generator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar collapsed" id="app-sidebar">
      <div class="sidebar-header">
        <svg class="app-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#1a2332"/>
          <polyline points="4,9 8,9 10,4 12,9 16,9 18,5 20,9 24,9 26,4 28,9" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="4,16 7,16 7,13 11,13 11,16 15,16 15,14 19,14 19,16 23,16 23,12 27,12 27,16 28,16" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="4,23 8,21 12,25 16,20 20,26 24,21 28,23" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sidebar-app-name" id="sidebar-app-name">Telemetry Generator</span>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-nav-item active" data-tab="telemetry" role="button" tabindex="0">
          <svg class="sidebar-nav-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
            <path d="M0 0h1v15h15v1H0V0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5z"/>
          </svg>
          <span class="sidebar-nav-label">Telemetry</span>
        </a>
        <a class="sidebar-nav-item" data-tab="settings" role="button" tabindex="0">
          <svg class="sidebar-nav-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.474l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
          </svg>
          <span class="sidebar-nav-label">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="https://github.com/ritesh8467/TelemetryGenerator" target="_blank" class="github-link sidebar-github" title="View on GitHub">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
            <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          <span class="sidebar-nav-label">GitHub</span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <div id="tab-telemetry" class="app-tab">
        <div id="config-status-bar" class="config-status-bar" style="display:none"></div>
        <header>
          <div class="header-inner">
            <div class="header-left">
              <div class="header-titles">
                <h1 id="app-title">Telemetry Generator</h1>
                <span class="subtitle">Sumo Logic HTTP Source Data Generator</span>
              </div>
            </div>
            <div class="header-right">
              <div id="aggregate-stats"></div>
              <div id="draft-indicator" style="display:none"></div>
            </div>
          </div>
        </header>
        <main>
          <div class="toolbar">
            <div class="toolbar-left">
              <button id="btn-add-source" class="btn btn-primary">+ Add Source</button>
              <button id="btn-test-send" class="btn btn-secondary">Test Send</button>
              <button id="btn-start-all" class="btn btn-success">Start All</button>
              <button id="btn-stop-all" class="btn btn-danger">Stop All</button>
              <button id="btn-versions" class="btn btn-secondary">Versions</button>
              <button id="btn-reset-all-stats" class="btn btn-secondary">Reset All Stats</button>
            </div>
            <div class="filter-group">
              <button class="btn-filter active" data-filter="all">All</button>
              <button class="btn-filter" data-filter="logs">Logs</button>
              <button class="btn-filter" data-filter="metrics">Metrics</button>
              <button class="btn-filter" data-filter="traces">Traces</button>
            </div>
          </div>
          <div id="sources-grid" class="sources-grid"></div>
        </main>
      </div>

      <div id="tab-settings" class="app-tab hidden">
        <header>
          <div class="header-inner">
            <div class="header-left">
              <div class="header-titles">
                <h1>Settings</h1>
                <span class="subtitle">Application configuration</span>
              </div>
            </div>
          </div>
        </header>
        <main>
          <div id="settings-content"></div>
        </main>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
