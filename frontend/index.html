<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetry Generator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="config-status-bar" class="config-status-bar"></div>

  <header>
    <div class="header-title">
      <svg class="app-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a2332"/>
        <polyline points="4,9 8,9 10,4 12,9 16,9 18,5 20,9 24,9 26,4 28,9" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="4,16 7,16 7,13 11,13 11,16 15,16 15,14 19,14 19,16 23,16 23,12 27,12 27,16 28,16" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="4,23 8,21 12,25 16,20 20,26 24,21 28,23" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Telemetry Generator</h1>
      <a href="https://github.com/ritesh8467/TelemetryGenerator" target="_blank" class="github-link" title="View on GitHub">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
          <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>
    <p class="subtitle">Sumo Logic HTTP Source Data Generator</p>
    <div class="header-bottom">
      <div id="aggregate-stats"></div>
      <div id="draft-indicator"></div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btn-add-source" class="btn btn-primary">+ Add Source</button>
        <button id="btn-test-send" class="btn btn-secondary">Test Send</button>
        <button id="btn-start-all" class="btn btn-success">Start All</button>
        <button id="btn-stop-all" class="btn btn-danger">Stop All</button>
        <button id="btn-versions" class="btn btn-secondary">Versions</button>
      </div>
      <div class="filter-group">
        <button class="btn-filter active" data-filter="all">All</button>
        <button class="btn-filter" data-filter="logs">Logs</button>
        <button class="btn-filter" data-filter="metrics">Metrics</button>
        <button class="btn-filter" data-filter="traces">Traces</button>
      </div>
    </div>
    <div id="sources-grid" class="sources-grid"></div>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
