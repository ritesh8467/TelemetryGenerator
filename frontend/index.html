    <div class="app-main">

      <div id="config-status-bar" class="config-status-bar" style="display:none"></div>

      <!-- ─── Observability tab ──────────────────────────────────── -->
      <div id="tab-observability" class="app-tab">
        <div class="page-header">
          <h1 class="page-title">Observability</h1>
          <div class="page-actions">
            <button id="btn-add-source-observability" class="btn btn-primary">+ Add Source</button>
            <button id="btn-test-send" class="btn btn-secondary">Test Send</button>
            <button id="btn-start-all" class="btn btn-success">Start All</button>
            <button id="btn-stop-all" class="btn btn-danger">Stop All</button>
            <button id="btn-reset-all-stats" class="btn btn-secondary">Reset All Stats</button>
          </div>
          <div class="filter-group">
            <button class="btn-filter active" data-filter="all">All</button>
            <button class="btn-filter" data-filter="logs">Logs</button>
            <button class="btn-filter" data-filter="metrics">Metrics</button>
            <button class="btn-filter" data-filter="traces">Traces</button>
          </div>
        </div>
        <main>
          <div id="sources-grid-observability" class="sources-grid"></div>
        </main>
      </div>

      <!-- ─── Security tab ───────────────────────────────────────── -->
      <div id="tab-security" class="app-tab hidden">
        <div class="page-header">
          <h1 class="page-title">Security</h1>
          <div class="page-actions">
            <button id="btn-add-source-security" class="btn btn-primary">+ Add Source</button>
            <button id="btn-start-all-security" class="btn btn-success">Start All</button>
            <button id="btn-stop-all-security" class="btn btn-danger">Stop All</button>
          </div>
          <div class="filter-group">
            <button class="btn-filter active" data-filter="all">All</button>
            <button class="btn-filter" data-filter="logs">Logs</button>
            <button class="btn-filter" data-filter="metrics">Metrics</button>
            <button class="btn-filter" data-filter="traces">Traces</button>
          </div>
        </div>
        <main>
          <div id="sources-grid-security" class="sources-grid"></div>
        </main>
      </div>

      <!-- ─── OTel Sources tab ───────────────────────────────────── -->
      <div id="tab-otel" class="app-tab hidden">
        <div class="page-header">
          <h1 class="page-title">OTel Apps</h1>
          <div class="page-actions">
            <button id="btn-add-source-otel" class="btn btn-primary">+ Add App</button>
            <button id="btn-start-all-otel" class="btn btn-success">Start All</button>
            <button id="btn-stop-all-otel" class="btn btn-danger">Stop All</button>
          </div>
        </div>
        <main>
          <div id="sources-grid-otel" class="sources-grid"></div>
        </main>
      </div>

      <!-- ─── Versions tab ─────────────────────────────────────── -->
      <div id="tab-versions" class="app-tab hidden">
        <div class="page-header">
          <h1 class="page-title">Versions</h1>
        </div>
        <main>
          <div id="versions-tab-content" class="versions-tab-wrap">
            <span style="color:var(--text-muted)">Loading...</span>
          </div>
        </main>
      </div>

      <!-- ─── Settings tab ──────────────────────────────────────── -->
      <div id="tab-settings" class="app-tab hidden">
        <div class="page-header">
          <h1 class="page-title">Settings</h1>
        </div>
        <main>
          <div id="settings-content"></div>
        </main>
      </div>

    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
